name = "nerkhemroozchand_bot"
main = "src/index.js"
compatibility_date = "2024-09-23"

# متغیرهای غیرمحرمانه (اینها امن است که در همین فایل و در گیت باشند).
# مقادیر محرمانه (توکن‌ها) هرگز اینجا نمی‌آیند؛ با `wrangler secret put`
# تنظیم می‌شوند (به README نگاه کنید).
[vars]
BOT_USERNAME = "nerkhemroozchand_bot"
EITAA_CHAT_ID = "nerkhemroozchand"
# برای فعال کردن ارسال خودکار زمان‌بندی‌شدهٔ گزارش ایتا، این را روی یکی
# از کدهای دسته بگذارید (مثلا "cur")؛ خالی/حذف = رفتار فعلی، یعنی خاموش.
# EITAA_CRON_CATEGORY = "cur"

# Cron Trigger اختیاری. پیش‌فرض خالی است تا رفتار فعلی پروژه (بدون ارسال
# خودکار) حفظ شود. اگر خواستید فعال کنید، خط زیر را از حالت کامنت خارج
# کنید (نمونه: هر ۶ ساعت یک‌بار) و EITAA_CRON_CATEGORY را هم بالا تنظیم
# کنید. Cloudflare حداکثر ۵ Cron Trigger رایگان در هر اکانت اجازه می‌دهد.
# [triggers]
# crons = ["0 */6 * * *"]
